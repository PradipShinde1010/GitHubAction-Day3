name: Delete AWS Resources

on:
  workflow_dispatch:   # Manual trigger (safe)
  # OR you can use push if needed

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      # 🔍 Get EC2 Instance ID (based on filter)
      - name: Get EC2 Instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      # 🛑 Terminate EC2 Instance
      - name: Terminate EC2 Instance
        run: |
          if [ -n "$INSTANCE_ID" ]; then
            aws ec2 terminate-instances --instance-ids $INSTANCE_ID
          else
            echo "No running instances found"
          fi

      # 🧹 Empty S3 Bucket
      - name: Empty S3 Bucket
        run: |
          aws s3 rm s3://my-github-actions-bucket-1234567891011 --recursive || true

      # ❌ Delete S3 Bucket
      - name: Delete S3 Bucket
        run: |
          aws s3 rb s3://my-github-actions-bucket-1234567891011 || true