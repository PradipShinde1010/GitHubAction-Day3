name: Nightly Build

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes (for demo)

jobs:
  scheduled-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn clean package